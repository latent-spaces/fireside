  <path d="M60 350h400l-40 110c-4 10-12 16-22 16H122c-10 0-18-6-22-16z" fill="#b8733a" stroke="#6b4122" stroke-width="5"/>
  <path d="M70 380h380" stroke="#6b4122" stroke-width="4"/>
  <path d="M84 420h352" stroke="#6b4122" stroke-width="4"/>
  <g fill="#2a1a0e"><circle cx="150" cy="400" r="9"/><circle cx="230" cy="400" r="9"/><circle cx="310" cy="400" r="9"/><circle cx="390" cy="400" r="9"/></g>
  <rect x="50" y="336" width="420" height="22" rx="6" fill="#7a4a24"/>
  <!-- bowsprit and lantern -->
