  <path d="M190 190h140M200 240h120" stroke="#e2d6b6" stroke-width="4"/>
  <!-- compass rose on the sail -->
  <g transform="translate(240 170)" fill="#1b8fc4">
    <path d="M0-52 10-10 52 0 10 10 0 52-10 10-52 0-10-10z"/>
    <circle r="9" fill="#f7f1e1" stroke="#1b8fc4" stroke-width="4"/>
  </g>
