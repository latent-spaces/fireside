<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fd8"/>
      <stop offset=".6" stop-color="#7cc6f0"/>
      <stop offset="1" stop-color="#d9f1fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b8fc4"/>
      <stop offset=".5" stop-color="#0f6fa6"/>
      <stop offset="1" stop-color="#0a4a78"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset=".35" stop-color="#fff2b0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff2b0" stop-opacity="0"/>
    </radialGradient>
    <g id="cloud" fill="#fff">
      <circle cx="0" cy="0" r="46"/><circle cx="52" cy="-22" r="60"/><circle cx="118" cy="-4" r="50"/>
      <circle cx="170" cy="12" r="36"/><rect x="-40" y="0" width="240" height="48" rx="24"/>
    </g>
  </defs>
  <rect width="1920" height="700" fill="url(#sky)"/>
  <circle cx="1500" cy="210" r="230" fill="url(#sun)"/>
  <g opacity=".95">
    <use href="#cloud" transform="translate(180 210) scale(1.3)"/>
    <use href="#cloud" transform="translate(760 130) scale(.9)"/>
    <use href="#cloud" transform="translate(1180 360) scale(1.1)"/>
    <use href="#cloud" transform="translate(1680 520) scale(.8)" opacity=".85"/>
    <use href="#cloud" transform="translate(420 520) scale(.7)" opacity=".8"/>
  </g>
  <!-- distant island -->
  <path fill="#3f8f5a" d="M90 700c40-60 110-96 190-96 60 0 96 26 130 56 30-24 70-38 110-30 40 8 60 40 70 70z"/>
  <path fill="#e9d7a4" d="M70 702c120-12 420-12 540 0z"/>
  <g fill="#2f6d44">
    <path d="M300 612c-6-40-2-80 8-110l6 2c-8 32-10 70-6 108z"/>
    <path d="M312 504c-30-8-62 0-84 22 26-8 52-12 84-6zM312 504c24-22 58-26 90-12-30 0-56 6-86 20zM312 504c-8-30 4-56 28-74-10 26-14 48-22 76z"/>
  </g>
  <rect y="700" width="1920" height="380" fill="url(#sea)"/>
  <rect y="698" width="1920" height="6" fill="#e6f7ff" opacity=".7"/>
  <!-- sun glitter -->
  <g fill="#fff" opacity=".55">
    <rect x="1420" y="730" width="140" height="4" rx="2"/><rect x="1380" y="760" width="90" height="3" rx="1.5"/>
    <rect x="1500" y="790" width="120" height="4" rx="2"/><rect x="1440" y="830" width="70" height="3" rx="1.5"/>
  </g>
  <!-- seagulls -->
  <g fill="none" stroke="#2a3b4c" stroke-width="5" stroke-linecap="round">
    <path d="M980 260q18-18 36 0q18-18 36 0"/>
    <path d="M1090 310q12-12 24 0q12-12 24 0"/>
    <path d="M620 330q14-14 28 0q14-14 28 0"/>
  </g>
</svg>
